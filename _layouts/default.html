<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#f7f7f5">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">WB<span>.</span></a>
  <nav class="nav">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    <a href="{{ '/projects/' | relative_url }}">Projects</a>
    <a href="{{ '/blog/' | relative_url }}">Writing</a>
    <a href="{{ '/cv/' | relative_url }}">CV</a>
  </nav>
  <div class="nav-actions">
    <button id="theme-toggle" aria-label="Toggle theme">◐</button>
    <a class="lang" href="{{ '/en/' | relative_url }}">EN</a>
  </div>
</header>
<main>{{ content }}</main>
<footer class="site-footer">
  <div><strong>Wilson BARIKI</strong><span> — Cybersecurity Student</span></div>
  <div class="footer-links"><a href="https://github.com/n0xbr3ak3r">GitHub</a><a href="#">LinkedIn</a><a href="mailto:hello@example.com">Email</a></div>
  <div>© {{ site.time | date: '%Y' }} Wilson BARIKI</div>
</footer>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
